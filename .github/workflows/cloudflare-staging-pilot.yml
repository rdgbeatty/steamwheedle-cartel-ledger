name: Seed and verify synthetic staging history

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days of synthetic history
        type: choice
        options: ['1', '7', '90']
        default: '1'
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  seed:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: staging-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Publish missing fixture days and verify chart values
        run: |
          test -n "$MARKET_API_URL"
          npm run pilot -- --days "$PILOT_DAYS"
        env:
          PILOT_DAYS: ${{ inputs.days }}
          MARKET_API_URL: ${{ vars.MARKET_API_URL }}
          MARKET_INGEST_TOKEN: ${{ secrets.MARKET_INGEST_TOKEN }}
