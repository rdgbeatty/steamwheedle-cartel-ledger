name: Collect live US PvP market books
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-forever-us-pvp
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish anonymous history and the latest market snapshot
        run: node src/collect-history.mjs
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          MARKET_INGEST_TOKEN: ${{ secrets.LIVE_MARKET_INGEST_TOKEN }}
          MARKET_API_URL: https://gathering-ledger.gathering-ledger.workers.dev

